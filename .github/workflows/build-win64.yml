name: Build VLC for Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unit tests
        run: tests/run-all.sh

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Read pinned VLC commit
        id: pin
        run: |
          sha="$(scripts/read-commit.sh VLC_COMMIT)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:9}" >> "$GITHUB_OUTPUT"

      - name: Download VLC source
        run: |
          git init -q vlc
          git -C vlc remote add origin https://github.com/videolan/vlc.git
          git -C vlc fetch -q --depth 1000 origin "${{ steps.pin.outputs.sha }}"
          git -C vlc checkout -q FETCH_HEAD

      - name: Apply patches
        run: scripts/apply-patches.sh vlc patches

      - name: Pick VLC's build image
        id: image
        run: |
          name="$(scripts/read-image.sh vlc/extras/ci/gitlab-ci.yml)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Find VLC's ready-made libraries
        id: contribs
        run: |
          sha="$(cd vlc && extras/ci/get-contrib-sha.sh win64)"
          url="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${sha}.tar.zst"
          if ! curl -fsIL "$url" >/dev/null; then
            echo "::error::VLC has no ready-made libraries for this commit ($url). Pick a newer commit for VLC_COMMIT." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build inside VLC's image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          CONTRIBS_URL: ${{ steps.contribs.outputs.url }}
        run: |
          docker run --rm --user root \
            -v "$PWD/vlc:/vlc" -v "$PWD/scripts:/scripts:ro" -w /vlc \
            -e VLC_PREBUILT_CONTRIBS_URL="$CONTRIBS_URL" \
            "$IMAGE" /scripts/container-build.sh

      - name: Check the zip
        id: zip
        run: |
          src="$(ls vlc/win64/vlc-*-win64.zip)"
          scripts/check-package.sh "$src"
          out="$(basename "$src" .zip)-${{ steps.pin.outputs.short }}.zip"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ steps.pin.outputs.short }}-run${{ github.run_number }}-a${{ github.run_attempt }}" \
            "${{ steps.zip.outputs.file }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "VLC 4 build ${{ steps.pin.outputs.short }} (run ${{ github.run_number }}-a${{ github.run_attempt }})" \
            --notes "VLC commit ${{ steps.pin.outputs.sha }}. Unzip and run vlc.exe."
